name: Cypress Tests
on:
  pull_request:
    branches: [shem/solutechSDET]
  push:
    branches: [shem/solutechSDET]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Docker environment
        run: |
          cd docker
          ./start.sh
          ./config.sh

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          headless: true
          config-file: cypress.config.js
          reporter: mochawesome
          reporter-options: "reportDir=cypress/reports,overwrite=false,html=false,json=true"
          
      - name: Generate test report summary
        if: always()
        run: |
          npx mochawesome-merge "cypress/reports/*.json" > merged-report.json
          echo "### Cypress Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Total Tests: $(jq '.stats.tests' merged-report.json)" >> $GITHUB_STEP_SUMMARY
          echo "Passed: $(jq '.stats.passes' merged-report.json)" >> $GITHUB_STEP_SUMMARY
          echo "Failed: $(jq '.stats.failures' merged-report.json)" >> $GITHUB_STEP_SUMMARY

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-report
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
            # Add to existing on: section
